global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 1s
    timeout client 60s
    timeout server 60s
    retries 3
    option redispatch

frontend keycloak_https_front_8443
    bind *:8443
    mode tcp
    default_backend keycloak_ingress_nodes

backend keycloak_ingress_nodes
    mode tcp
    balance roundrobin
    option tcp-check
    server n00 78.28.135.130:443 check inter 500ms fall 1 rise 2
    server n01 78.28.135.131:443 check inter 500ms fall 1 rise 2
    server n02 78.28.135.132:443 check inter 500ms fall 1 rise 2
